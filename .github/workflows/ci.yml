# CI: typecheck, lint, testes unitários (Vitest) e os validadores do MCP em todo push/PR na main.
# Sem deploy (a Vercel cuida do build de produção). Os unitários são HERMÉTICOS: sem banco e sem rede
# (vitest.setup.ts) — nenhum secret entra aqui. Playwright (e2e) não roda neste job.
# O postinstall do npm ci já roda `prisma generate`, mas o passo explícito
# fica como rede de segurança caso o postinstall mude.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Gate obrigatório: falha de teste derruba o job. Sem DATABASE_URL de propósito — o teste que alcançar o
      # banco real quebra no import (ver vitest.setup.ts).
      - name: Testes unitários (Vitest)
        run: npm run test:unit

      # Roda SEM env de propósito: o catálogo tem de carregar sem DATABASE_URL
      # (handlers só alcançam db por import dinâmico) — ver o cabeçalho do script.
      - name: Registro MCP (invariantes, snapshots, porta)
        run: npx tsx scripts/validar-registro-mcp.ts

      # Mesma regra: oauth-regras.ts é puro e carrega sem env.
      - name: OAuth MCP (audiência, PKCE, prazos)
        run: npx tsx scripts/validar-oauth-mcp.ts

      # CP5b: o JSON da impressão digital de uma versão já na main é imutável; versão nova exige arquivo novo.
      - name: Impressão digital das regras (imutável por versão)
        run: npx tsx scripts/validar-impressao-digital.ts
