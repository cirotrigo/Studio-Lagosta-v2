# Diagnostic branch only. No merge/PR, secrets, DB, external images, or deployment.
name: diag-worker
on:
  push:
    branches: [diag/morte-do-worker]
permissions:
  contents: read
concurrency:
  group: diag-worker
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install candidate integration dependencies
        run: npm ci
      - name: Prepare synthetic evidence directory
        run: mkdir -p "$RUNNER_TEMP/review238"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
      - name: Original regressions unchanged
        if: always()
        run: npx vitest run --config diag-worker/vitest.review238.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/review238/regressions.json"
      - name: Synthetic G21 rendering parity only (G24 uses historical client fixture)
        if: always()
        run: npx vitest run --config diag-worker/vitest.review238-gate.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/review238/gate-parity.json"
      - name: Directed recovery probes and cold thumbnail
        if: always()
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/review238
        run: npx vitest run --config diag-worker/vitest.review238-probes.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/review238/probes.json"
      - name: Compare synthetic rasters old and candidate
        if: always()
        run: |
          set -e
          B="$RUNNER_TEMP/baseline"
          mkdir -p "$B"
          cp diag-worker/baseline/package*.json "$B/"
          npm ci --prefix "$B" --ignore-scripts --no-audit --no-fund
          node diag-worker/review238/raster.cjs "$B/node_modules/@napi-rs/canvas" "$RUNNER_TEMP/review238" baseline
          node diag-worker/review238/raster.cjs "$GITHUB_WORKSPACE/node_modules/@napi-rs/canvas" "$RUNNER_TEMP/review238" candidate
          node diag-worker/review238/compare.cjs "$RUNNER_TEMP/review238"
      - name: Preserve only synthetic images and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review238-synthetic
          path: |
            ${{ runner.temp }}/review238/*.json
            ${{ runner.temp }}/review238/*.png
          retention-days: 7
          if-no-files-found: error
