<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600;1,700&family=Lato:ital,wght@0,300;0,400;0,700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FCE77B; } a:hover { color: #F9F7F2; }
    .halo {
      position: absolute; z-index: 0; pointer-events: none;
      background: rgb(36 0 0 / var(--a));
      filter: blur(var(--r));
      border-radius: calc(var(--r) + 60px);
    }
    .veu-b {
      background: linear-gradient(to top,
        rgb(36 0 0 / var(--veu)) 0%,
        rgb(36 0 0 / var(--veu)) 40%,
        rgb(36 0 0 / calc(var(--veu) * 0.52)) 68%,
        rgb(36 0 0 / 0) 100%);
    }
    .veu-t {
      background: linear-gradient(to bottom,
        rgb(36 0 0 / var(--veu)) 0%,
        rgb(36 0 0 / var(--veu)) 40%,
        rgb(36 0 0 / calc(var(--veu) * 0.52)) 68%,
        rgb(36 0 0 / 0) 100%);
    }
  </style>
</helmet>
